---
# network_config.yml - Ansible playbook for configuring network with VLANs in pull mode

- name: Configure network with VLANs
  hosts: localhost
  connection: local
  become: true
  
  vars_files:
    - vars/main.yml
  
  tasks:
    - name: Install required packages
      apt:
        name:
          - vlan
          - ifupdown
          - iproute2
        state: present
        update_cache: yes
      
    - name: Enable VLAN module
      modprobe:
        name: 8021q
        state: present
    
    - name: Ensure VLAN module loads on boot
      lineinfile:
        path: /etc/modules
        line: 8021q
        state: present
        create: yes
        
    - name: Configure network interfaces
      template:
        src: templates/network_interfaces.j2
        dest: /etc/network/interfaces
        owner: root
        group: root
        mode: 0644
      notify: restart networking

  handlers:
    - name: restart networking
      service:
        name: networking
        state: restarted
