---
- name: Configure network interfaces
  template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: 0644
  notify: restart networking

- name: Install dnsmasq for DHCP
  apt:
    name: dnsmasq
    state: present
    update_cache: yes

- name: Configure dnsmasq for DHCP
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: 0644
  notify: restart dnsmasq

- name: Enable and start dnsmasq service
  service:
    name: dnsmasq
    state: started
    enabled: yes

# PXE Boot configuration tasks
- name: Install UEFI PXE boot requirements
  apt:
    name:
      - grub-efi-amd64-signed
      - grub-common
      - shim-signed
    state: present
  when: pxe.enabled | default(false)

- name: Create TFTP root directory
  file:
    path: "{{ pxe.tftp_root }}"
    state: directory
    mode: 0755
  when: pxe.enabled | default(false)

- name: Create UEFI directory structure
  file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  with_items:
    - "{{ pxe.tftp_root }}/EFI/BOOT"
    - "{{ pxe.tftp_root }}/grub"
    - "{{ pxe.tftp_root }}/debian"
  when: pxe.enabled | default(false)

- name: Copy UEFI boot files
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: yes
  with_items:
    - { src: "/usr/lib/shim/shimx64.efi.signed", dest: "{{ pxe.tftp_root }}/EFI/BOOT/BOOTX64.EFI" }
    - { src: "/usr/lib/grub/x86_64-efi-signed/grubnetx64.efi.signed", dest: "{{ pxe.tftp_root }}/EFI/BOOT/grubx64.efi" }
  when: pxe.enabled | default(false)

- name: Copy GRUB EFI bootloader to TFTP root
  copy:
    src: "/usr/lib/grub/x86_64-efi-signed/grubnetx64.efi.signed"
    dest: "{{ pxe.tftp_root }}/grubx64.efi"
    remote_src: yes
  when: pxe.enabled | default(false)

- name: Create GRUB configuration
  template:
    src: grub.cfg.j2
    dest: "{{ pxe.tftp_root }}/grub/grub.cfg"
    mode: 0644
  when: pxe.enabled | default(false)

- name: Create GRUB modules directory
  file:
    path: "{{ pxe.tftp_root }}/grub/x86_64-efi"
    state: directory
    mode: 0755
  when: pxe.enabled | default(false)

- name: Copy GRUB module listings
  copy:
    src: "/usr/lib/grub/x86_64-efi/{{ item }}"
    dest: "{{ pxe.tftp_root }}/grub/x86_64-efi/{{ item }}"
    remote_src: yes
  with_items:
    - command.lst
    - fs.lst
    - crypto.lst
    - terminal.lst
  ignore_errors: yes
  when: pxe.enabled | default(false)

- name: Download Debian installer files
  get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: 0644
  with_items:
    - { url: "{{ pxe.debian.kernel_url }}", dest: "{{ pxe.tftp_root }}/debian/vmlinuz" }
    - { url: "{{ pxe.debian.initrd_url }}", dest: "{{ pxe.tftp_root }}/debian/initrd.gz" }
  when: pxe.enabled | default(false) and pxe.debian.enabled | default(false)
