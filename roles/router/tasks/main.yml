---
- name: Configure network interfaces
  template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: 0644
  notify: restart networking

- name: Install dnsmasq for DHCP
  apt:
    name: dnsmasq
    state: present
    update_cache: yes

- name: Configure dnsmasq for DHCP
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: 0644
  notify: restart dnsmasq

- name: Enable and start dnsmasq service
  service:
    name: dnsmasq
    state: started
    enabled: yes
