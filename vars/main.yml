---
# Network configuration variables

# Main interface to use
interface: "{{ ansible_default_ipv4.interface | default('eth0') }}"

# WAN settings (VLAN 10)
wan:
  vlan: 10
  address: "192.168.0.16"
  netmask: "255.255.255.0"
  gateway: "192.168.0.1"

# LAN settings (VLAN 20)
lan:
  vlan: 20
  address: "172.16.0.1"
  netmask: "255.255.255.0"

